[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "multi-agent-trading-intelligence"
version = "0.1.0"
description = "Standalone modular trading intelligence and execution-governance scaffold"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "ta>=0.11",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "aiosqlite>=0.19",
    "keyring>=25.0",
    "ccxt>=4.4",
    "web3>=7.0",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "ruff>=0.6",
]
mt5 = ["MetaTrader5>=5.0"]

[project.scripts]
ti-offchain-bot = "trading_intelligence.offchain_bot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/trading_intelligence"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = ["E501"]
